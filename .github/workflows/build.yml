name: build

on:
  push:
    paths: [ '.github/workflows/build.yml', 'Magpie.slnx', '*.props', 'scripts/publish.py', 'src/**' ]
  pull_request:
    paths: [ '.github/workflows/build.yml', 'Magpie.slnx', '*.props', 'scripts/publish.py', 'src/**' ]

jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        compiler: ["MSVC"]
        platform: ["x64"]

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Setup Conan
      run: pip install conan

    - name: Load Conan cache
      uses: actions/cache@v6
      with:
        path: ~/.conan2/p
        key: Conan-${{ hashFiles('src/**/conanfile.txt') }}-${{ matrix.compiler }}-${{ matrix.platform }}

    - name: Fetch NVIDIA DLSS SDK headers
      run: |
        git clone --depth 1 --filter=blob:none --sparse https://github.com/NVIDIA/DLSS.git DLSS_SDK
        cd DLSS_SDK
        git sparse-checkout set include

    - name: Enable NVIDIA DLSS features
      run: |
        $sdk = "$env:GITHUB_WORKSPACE\DLSS_SDK"
        $xml = '<Project xmlns="http://schemas.microsoft.com/developer/msbuild/2003"><PropertyGroup>' +
          '<EnableDLSSSR>true</EnableDLSSSR>' +
          '<EnableDLSSFrameGeneration>true</EnableDLSSFrameGeneration>' +
          '<EnableDLSSNR>true</EnableDLSSNR>' +
          '<DLSSSdkDir>' + $sdk + '</DLSSSdkDir>' +
          '</PropertyGroup></Project>'
        Set-Content -Path src\BuildOptions.props.user -Value $xml -Encoding utf8
        Get-Content src\BuildOptions.props.user
        Get-ChildItem "$sdk\include" | Select-Object -First 3 Name

    - name: Build
      if: github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main'
      run: python scripts/publish.py --compiler=${{ matrix.compiler }} --platform=${{ matrix.platform }}

    - name: Build and sign
      if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
      run: python scripts/publish.py --compiler=${{ matrix.compiler }} --platform=${{ matrix.platform }} --pfx-path=certs\Magpie.pfx --pfx-password="${{ secrets.MAGPIE_PFX_PASSWORD }}"

    - name: Save hash
      id: hash
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

    - name: Store build
      uses: actions/upload-artifact@v7
      with: 
          name: Magpie-dev-${{ steps.hash.outputs.sha_short }}-${{ matrix.compiler }}-${{ matrix.platform }}
          path: ./publish/${{ matrix.platform }}
