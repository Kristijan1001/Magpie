name: build

on:
  workflow_dispatch:
  push:
    paths: [ '.github/workflows/build.yml', 'Magpie.sln', '*.props', 'publish.py', 'src/**' ]
  pull_request:
    paths: [ '.github/workflows/build.yml', 'Magpie.sln', '*.props', 'publish.py', 'src/**' ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: ["x64"]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup Conan
      run: pip install conan

    - name: Load Conan cache
      uses: actions/cache@v4
      with:
        path: ~/.conan2/p
        key: Conan-${{ hashFiles('src/**/conanfile.txt') }}-${{ matrix.platform }}

    # No signing cert in this fork. publish.py only runs signtool when the
    # password argument is non-empty:
    #   if len(sys.argv) >= 5 and sys.argv[4] != "":
    # so passing "" skips signing and the build still produces a usable exe.
    - name: Build
      run: python publish.py ${{ matrix.platform }} unpackaged certs\Magpie.pfx ""

    - name: Save hash
      id: hash
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT

    - name: Store build
      uses: actions/upload-artifact@v4
      with:
          name: Magpie-dev-${{ steps.hash.outputs.sha_short }}-${{ matrix.platform }}
          path: ./publish/${{ matrix.platform }}
